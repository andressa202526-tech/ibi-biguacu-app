
<!-- NOVA ÁREA DE MEMBROS IBI BIGUAÇU -->
<style>
nav [data-page="aniversarios"],
#aniversarios { display:none !important; }

#ibiPainelNovo {
  font-family:inherit;
  margin:24px 0;
}
.ibiBoasVindas {
  background:linear-gradient(135deg,#071b41,#174b86);
  color:white;
  padding:26px;
  border-radius:18px;
  margin-bottom:22px;
}
.ibiBoasVindas h2 {
  color:white;
  margin:8px 0;
  font-size:clamp(22px,4vw,30px);
}
.ibiBoasVindas p { color:#d8e5f7; }
.ibiCards {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin:20px 0;
}
.ibiCard {
  background:#fff;
  color:#102b52;
  border:1px solid #d8e3f0;
  border-radius:15px;
  padding:19px 14px;
  text-align:left;
  cursor:pointer;
  box-shadow:0 3px 12px #071b4110;
}
.ibiCard strong {
  display:block;
  font-size:16px;
  margin-bottom:7px;
}
.ibiCard span {
  display:block;
  font-size:13px;
  opacity:.75;
}
.ibiCard.ativo {
  background:#e7f0ff;
  border-color:#235a9f;
}
.ibiConteudo {
  background:#fff;
  color:#18304e;
  border:1px solid #dce5f0;
  padding:20px;
  border-radius:16px;
  margin-top:15px;
}
.ibiConteudo[hidden] { display:none !important; }
#ibiPainelNovo input,
#ibiPainelNovo textarea {
  width:100%;
  max-width:100%;
  padding:11px;
  margin:8px 0;
  border:1px solid #cad7e7;
  border-radius:9px;
  box-sizing:border-box;
}
#ibiPainelNovo button.ibiAcao {
  background:#123e77;
  color:white;
  border:0;
  border-radius:9px;
  padding:12px 18px;
  cursor:pointer;
}
.ibiEscala {
  padding:13px 0;
  border-bottom:1px solid #e1e7ef;
  overflow-wrap:anywhere;
}
.ibiEscala small { color:#576b83; }
@media(min-width:750px) {
  .ibiCards { grid-template-columns:repeat(3,1fr); }
}
</style>

<script>
(function() {
  "use strict";

  const painelAprovado = document.getElementById("approvedArea");
  const areaMembro = document.getElementById("memberArea");
  const perfilForm = document.getElementById("profileForm");

  if (!painelAprovado || !areaMembro) return;

  function elemento(tag, texto) {
    const el = document.createElement(tag);
    if (texto !== undefined) el.textContent = texto;
    return el;
  }

  function cliente() {
    try {
      return typeof db !== "undefined" ? db : null;
    } catch {
      return null;
    }
  }

  const painel = elemento("div");
  painel.id = "ibiPainelNovo";

  painel.innerHTML = `
    <div class="ibiBoasVindas">
      <small>IBI BIGUAÇU • ÁREA EXCLUSIVA</small>
      <h2 id="ibiSaudacao">Olá, graça e paz!</h2>
      <p>Que bom ter você aqui! Somos igreja, somos família.</p>
      <small>✓ Membro aprovado</small>
    </div>

    <div class="ibiCards">
      <button class="ibiCard ativo" type="button"
              data-ibi-aba="avisos">
        <strong>📢 Avisos internos</strong>
        <span>Comunicados da igreja</span>
      </button>
      <button class="ibiCard" type="button"
              data-ibi-aba="escalas">
        <strong>📋 Escalas</strong>
        <span>Louvor, mídia, Kids...</span>
      </button>
      <button class="ibiCard" type="button"
              data-ibi-aba="aniversarios">
        <strong>🎂 Aniversariantes</strong>
        <span>Aniversários autorizados</span>
      </button>
      <button class="ibiCard" type="button"
              data-ibi-aba="mensagens">
        <strong>✉️ Minhas mensagens</strong>
        <span>Recados pessoais</span>
      </button>
      <button class="ibiCard" type="button"
              data-ibi-aba="perfil">
        <strong>👤 Meu perfil</strong>
        <span>Dados cadastrais</span>
      </button>
      <button class="ibiCard" type="button"
              data-ibi-aba="agenda">
        <strong>📅 Agenda</strong>
        <span>Programações da igreja</span>
      </button>
    </div>

    <section class="ibiConteudo" id="ibiAbaAvisos">
      <h3>📢 Avisos da igreja</h3>
      <div id="ibiDestinoAvisos"></div>
    </section>

    <section class="ibiConteudo" id="ibiAbaEscalas" hidden>
      <h3>📋 Escalas dos ministérios</h3>
      <div id="ibiListaEscalas">Carregando escalas...</div>
      <div id="ibiAdminEscalas"></div>
    </section>

    <section class="ibiConteudo" id="ibiAbaAniversarios" hidden>
      <h3>🎂 Aniversariantes do mês</h3>
      <div id="ibiDestinoAniversarios"></div>
    </section>

    <section class="ibiConteudo" id="ibiAbaMensagens" hidden>
      <h3>✉️ Minhas mensagens</h3>
      <div id="ibiDestinoMensagens"></div>
    </section>

    <section class="ibiConteudo" id="ibiAbaPerfil" hidden>
      <h3>👤 Meu perfil</h3>
      <p>Atualize seus dados no formulário abaixo.</p>
    </section>

    <section class="ibiConteudo" id="ibiAbaAgenda" hidden>
      <h3>📅 Agenda da igreja</h3>
      <p>Confira os cultos e programações.</p>
      <button type="button" class="ibiAcao"
              id="ibiAbrirAgenda">
        Ver agenda
      </button>
    </section>
  `;

  painelAprovado.insertBefore(
    painel,
    painelAprovado.firstChild
  );

  function moverConteudo(id, destino) {
    const origem = document.getElementById(id);
    const alvo = document.getElementById(destino);

    if (origem && alvo) alvo.appendChild(origem);
  }

  moverConteudo("announcements", "ibiDestinoAvisos");
  moverConteudo("inbox", "ibiDestinoMensagens");
  moverConteudo("birthdays", "ibiDestinoAniversarios");

  // O formulário de perfil permanece com o ID original.
  const caixaPerfil = perfilForm
    ? perfilForm.closest(".panel")
    : null;

  function selecionarAba(nome) {
    const abas = [
      "avisos", "escalas", "aniversarios",
      "mensagens", "perfil", "agenda"
    ];

    abas.forEach(aba => {
      const id = "ibiAba" +
        aba.charAt(0).toUpperCase() + aba.slice(1);

      const secao = document.getElementById(id);
      if (secao) secao.hidden = aba !== nome;
    });

    painel.querySelectorAll("[data-ibi-aba]")
      .forEach(botao => {
        botao.classList.toggle(
          "ativo",
          botao.dataset.ibiAba === nome
        );
      });

    if (caixaPerfil) {
      caixaPerfil.style.display =
        nome === "perfil" ? "" : "none";
    }

    if (nome === "escalas") carregarEscalas();
  }

  painel.querySelectorAll("[data-ibi-aba]")
    .forEach(botao => {
      botao.addEventListener("click", () => {
        selecionarAba(botao.dataset.ibiAba);
      });
    });

  document.getElementById("ibiAbrirAgenda")
    .addEventListener("click", () => {
      const botao = document.querySelector(
        'nav [data-page="agenda"]'
      );

      if (botao) botao.click();
      else {
        document.querySelectorAll(".page")
          .forEach(p => p.classList.remove("active"));
        document.getElementById("agenda")
          ?.classList.add("active");
      }

      window.scrollTo(0, 0);
    });

  // SAUDAÇÃO COM NOME REAL
  async function atualizarNome() {
    const api = cliente();
    if (!api) return;

    try {
      const { data: sessao } = await api.auth.getUser();
      const usuario = sessao?.user;
      if (!usuario) return;

      const { data: perfil } = await api
        .from("profiles")
        .select("display_name")
        .eq("id", usuario.id)
        .maybeSingle();

      const nome =
        perfil?.display_name ||
        usuario.user_metadata?.display_name ||
        "";

      const primeiroNome = nome.trim().split(/\s+/)[0];

      document.getElementById("ibiSaudacao")
        .textContent = primeiroNome
          ? "Olá, graça e paz, " + primeiroNome + "!"
          : "Olá, graça e paz!";
    } catch (erro) {
      console.warn("Saudação:", erro);
    }
  }

  // ESCALAS: VISÍVEIS SÓ NO PAINEL APROVADO
  async function carregarEscalas() {
    const lista = document.getElementById("ibiListaEscalas");
    const api = cliente();

    if (!api || painelAprovado.hidden) return;

    lista.textContent = "Carregando escalas...";

    const { data, error } = await api
      .from("ibi_escalas")
      .select("id,ministerio,titulo,data_escala,detalhes")
      .order("data_escala", { ascending:true })
      .limit(100);

    lista.replaceChildren();

    if (error) {
      lista.textContent =
        "Não foi possível carregar as escalas. " +
        "Confira a tabela ibi_escalas no Supabase.";
      console.error("Escalas:", error);
      return;
    }

    if (!data?.length) {
      lista.textContent = "Nenhuma escala publicada ainda.";
      return;
    }

    data.forEach(escala => {
      const div = elemento("div");
      div.className = "ibiEscala";

      div.append(
        elemento("strong",
          escala.ministerio + " — " + escala.titulo
        ),
        elemento("p", escala.detalhes || ""),
        elemento("small",
          "Data: " + escala.data_escala
        )
      );

      lista.appendChild(div);
    });
  }

  // PUBLICAÇÃO DE ESCALAS PELO ADMINISTRADOR
  const adminEscalas =
    document.getElementById("ibiAdminEscalas");

  let formularioAdminCriado = false;

  async function configurarAdminEscalas() {
    const api = cliente();
    if (!api || formularioAdminCriado) return;

    const { data: auth } = await api.auth.getUser();
    if (!auth?.user) return;

    const { data: perfil } = await api
      .from("profiles")
      .select("role,approved")
      .eq("id", auth.user.id)
      .maybeSingle();

    if (
      perfil?.role !== "admin" ||
      perfil?.approved !== true
    ) return;

    formularioAdminCriado = true;

    const titulo = elemento("h3", "Publicar nova escala");
    const form = elemento("form");

    form.innerHTML = `
      <label>Ministério
        <input name="ministerio"
               placeholder="Ex.: Louvor" required>
      </label>
      <label>Título
        <input name="titulo"
               placeholder="Ex.: Escala de domingo" required>
      </label>
      <label>Data
        <input name="data_escala"
               type="date" required>
      </label>
      <label>Integrantes e informações
        <textarea name="detalhes" rows="5"
          placeholder="Nomes, horários e observações"
          required></textarea>
      </label>
      <button type="submit" class="ibiAcao">
        Publicar escala
      </button>
      <p role="status"></p>
    `;

    adminEscalas.append(titulo, form);

    form.addEventListener("submit", async evento => {
      evento.preventDefault();

      const dados = new FormData(form);
      const botao = form.querySelector("button");
      const status = form.querySelector('[role="status"]');

      botao.disabled = true;
      status.textContent = "Publicando...";

      const { error } = await api.from("ibi_escalas")
        .insert({
          ministerio: dados.get("ministerio").trim(),
          titulo: dados.get("titulo").trim(),
          data_escala: dados.get("data_escala"),
          detalhes: dados.get("detalhes").trim()
        });

      botao.disabled = false;

      if (error) {
        status.textContent = "Erro: " + error.message;
        return;
      }

      form.reset();
      status.textContent = "Escala publicada!";
      await carregarEscalas();
    });
  }

  // MANTÉM PERFIL ACESSÍVEL DURANTE APROVAÇÃO
  function atualizarVisibilidade() {
    if (!painelAprovado.hidden) {
      atualizarNome();
      configurarAdminEscalas();
    } else if (caixaPerfil) {
      caixaPerfil.style.display = "";
    }
  }

  // Começar mostrando os avisos
  selecionarAba("avisos");
  atualizarVisibilidade();

  // Atualizar quando o login for concluído
  const api = cliente();

  if (api) {
    api.auth.onAuthStateChange(() => {
      setTimeout(atualizarVisibilidade, 100);
    });
  }

  // Detectar quando o app.js liberar a área do membro
  const observador = new MutationObserver(() => {
    atualizarVisibilidade();
  });

  observador.observe(painelAprovado, {
    attributes:true,
    attributeFilter:["hidden"]
  });
})();
</script>
<!-- FIM DA NOVA ÁREA DE MEMBROS -->
